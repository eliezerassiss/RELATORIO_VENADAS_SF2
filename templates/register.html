{% extends "base.html" %}
{% block title %}Cadastro{% endblock %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h2 class="mb-4">Novo Cadastro</h2>
            <p class="alert alert-info">Após o cadastro, sua conta precisará ser aprovada pelo administrador.</p>
            <form method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuário</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Solicitar Cadastro</button>
            </form>
        </div>
    </div>
{% endblock %}
